name: Build & Deploy to SealOS Singapore

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/learn-with-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to SealOS via kubectl
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.SEALOS_KUBECONFIG }}
        with:
          args: set image deployment/learn-with-ai learn-with-ai=${{ env.IMAGE_NAME }}:${{ github.sha }} -n ${{ secrets.SEALOS_NAMESPACE }}

      - name: Wait for rollout
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.SEALOS_KUBECONFIG }}
        with:
          args: rollout status deployment/learn-with-ai -n ${{ secrets.SEALOS_NAMESPACE }} --timeout=120s

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployed ${{ github.sha }} to SealOS Singapore"
          else
            echo "Deployment failed for ${{ github.sha }}"
          fi
